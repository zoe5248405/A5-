<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<title>A5 書籍完整 Mockup</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<style>
body { margin:0; display:flex; height:100vh; font-family:'Helvetica Neue', Arial, sans-serif; background:#f4f4f6; color:#333; overflow:hidden; }
#app-container { display:flex; width:100%; height:100%; }
#settings-panel { width:300px; background:#fff; padding:20px; overflow-y:auto; box-shadow:2px 0 10px rgba(0,0,0,0.05); flex-shrink:0; }
h3{ margin-top:0; color:#1a73e8; border-bottom:1px solid #eee; padding-bottom:10px; font-weight:500; }
.setting-group{ margin-bottom:20px; padding:15px; border:1px solid #e0e0e0; border-radius:8px; background:#fafafa; }
.setting-group h4{ margin-top:0; font-size:16px; color:#333; border-bottom:1px solid #ddd; padding-bottom:5px; margin-bottom:10px; }
label{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; font-size:14px; font-weight:500; cursor:pointer; }
input[type="number"], input[type="text"], select, input[type="color"]{ padding:6px; border-radius:4px; border:1px solid #ccc; width:100px; box-sizing:border-box; font-size:14px; }
input[type="color"]{ width:30px; height:30px; padding:0; border:none; background:transparent; }
input[type="range"]{ flex-grow:1; margin-right:10px; }
.range-label{ display:block; width:100%; margin-top:5px; }
.range-value{ width:40px; text-align:right; font-weight:normal; }
.file-upload-label{ background:#e9e9e9; border:1px solid #ccc; padding:8px 12px; border-radius:4px; text-align:center; transition:background 0.2s; flex-grow:1; }
.file-upload-label:hover{ background:#ddd; }
.upload-row{ display:flex; justify-content:space-between; margin-bottom:10px; }
#actions{ display:flex; flex-direction:column; gap:10px; margin-top:20px; padding-top:15px; border-top:1px solid #e0e0e0; }
button{ padding:10px 15px; border-radius:6px; border:none; font-weight:bold; cursor:pointer; transition: background 0.2s, opacity 0.2s; }
#renderBtn{ background:#1a73e8; color:white; } #renderBtn:hover{ background:#155bb5; }
#downloadBtn{ background:#00a87f; color:white; } #downloadBtn:hover{ background:#008f6b; }
#wmResetBtn{ background:#f0f0f0; color:#333; padding:8px 12px; } #wmResetBtn:hover{ background:#e0e0e0; }
#canvas-container{ flex-grow:1; display:flex; justify-content:center; align-items:center; padding:20px; position:relative; overflow:hidden; }
canvas{ width:100%; height:100%; display:block; border-radius:8px; box-shadow:0 10px 30px rgba(0,0,0,0.1); cursor:grab; background:#f7f7f9; max-width:1200px; max-height:900px; }
</style>
</head>
<body>
<div id="app-container">
    <div id="settings-panel">
        <h3>A5 書籍 Mockup 設定</h3>
        <div class="setting-group">
            <h4>📔 圖稿與尺寸設定</h4>
            <div class="upload-row">
                <label class="file-upload-label">上傳封面展開圖<input id="combinedInput" type="file" accept="image/*" style="display:none"></label>
            </div>
            <label><span>書脊寬度 (mm)</span><input id="spineWidth" type="number" min="1" max="200" value="11"></label>
            <label><span>出血數值 (mm)</span><input id="bleedMM" type="number" min="0" max="50" value="3"></label>
            <label><span>翻書方向</span>
                <select id="bookDir"><option value="L">左翻書</option><option value="R">右翻書</option></select>
            </label>
        </div>
        <div class="setting-group">
            <h4>✨ 表面效果</h4>
            <label><span>上光/霧膜</span>
                <select id="finishType"><option value="none">None</option><option value="glossy">Glossy (光面)</option><option value="matte">Matte (霧面)</option></select>
            </label>
            <label><span>啟用上光效果</span><input type="checkbox" id="finishEnable" checked></label>
        </div>
        <div class="setting-group">
            <h4>💧 浮水印</h4>
            <div class="upload-row">
                <label class="file-upload-label">上傳浮水印<input id="watermarkInput" type="file" accept="image/*" style="display:none"></label>
            </div>
            <label><span>顯示浮水印</span><input type="checkbox" id="wmEnable" checked></label>
            <label class="range-label"><span>浮水印透明度</span><input id="wmOpacity" type="range" min="0" max="1" step="0.01" value="0.3"><span class="range-value" id="wmOpacityValue">0.3</span></label>
            <label class="range-label"><span>浮水印縮放</span><input id="wmScale" type="range" min="0.1" max="3" step="0.01" value="1"><span class="range-value" id="wmScaleValue">1</span></label>
            <label class="range-label"><span>浮水印旋轉</span><input id="wmRotate" type="range" min="0" max="360" step="1" value="0"><span class="range-value" id="wmRotateValue">0°</span></label>
            <button id="wmResetBtn">浮水印回中心/重置大小</button>
        </div>
        <div class="setting-group">
            <h4>🖼️ 背景設定</h4>
            <label><span>背景顏色</span><input type="color" id="bgColor" value="#f4f4f6"></label>
            <div class="upload-row">
                <label class="file-upload-label">自訂背景圖片<input id="bgImageInput" type="file" accept="image/*" style="display:none"></label>
            </div>
            <label><span>透明背景 (PNG)</span><input type="checkbox" id="transparentBg"></label>
        </div>
        <div id="actions">
            <label><span>書名 (作為檔名)</span><input type="text" id="bookTitle" placeholder="輸入書名"></label>
            <button id="renderBtn">重新渲染 🔃</button>
            <button id="downloadBtn">下載 PNG 💾</button>
        </div>
    </div>

    <div id="canvas-container">
        <canvas id="cvs"></canvas>
    </div>
</div>

<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script>
let mainTex=null, wmTex=null, bgTex=null;
let wmOpacity=0.3, wmScale=1, wmRotate=0;
let watermarkMesh=null, bookGroup=null;

const canvas=document.getElementById('cvs');
const renderer=new THREE.WebGLRenderer({canvas,preserveDrawingBuffer:true,antialias:true,alpha:true});
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;

const scene=new THREE.Scene();
scene.background=new THREE.Color(document.getElementById('bgColor').value);

const camera=new THREE.PerspectiveCamera(45,1,0.1,1000);
camera.position.set(0,100,300);
camera.lookAt(0,0,0);

// 光源
const hemi=new THREE.HemisphereLight(0xffffff,0x444444,0.7); scene.add(hemi);
const dir=new THREE.DirectionalLight(0xffffff,1.5); dir.position.set(100,200,150); dir.castShadow=true; scene.add(dir);
const fillLight=new THREE.DirectionalLight(0xeeeeff,0.4); fillLight.position.set(-50,50,-50); scene.add(fillLight);

// 地面
const floorGeo=new THREE.PlaneGeometry(800,800);
const floorMat=new THREE.MeshPhongMaterial({color:0xf4f4f6});
const floor=new THREE.Mesh(floorGeo,floorMat);
floor.rotation.x=-Math.PI/2; floor.position.y=-40; floor.receiveShadow=true; scene.add(floor);

// group
bookGroup=new THREE.Group(); scene.add(bookGroup);

// renderer & resize
function initRenderer(){
    const container=document.getElementById('canvas-container');
    const width=container.clientWidth || 1200;
    const height=container.clientHeight || 900;
    renderer.setSize(width,height,false);
    camera.aspect=width/height;
    camera.updateProjectionMatrix();
}
window.addEventListener('load',initRenderer);
window.addEventListener('resize',initRenderer);

// 設定讀取
function getSettings(){
    return {
        spineWidth: Number(document.getElementById('spineWidth').value),
        bleedMM: Number(document.getElementById('bleedMM').value),
        finishType: document.getElementById('finishType').value,
        wmEnable: document.getElementById('wmEnable').checked,
        finishEnable: document.getElementById('finishEnable').checked
    };
}

// 建立書本
function buildBook(){
    const {spineWidth, bleedMM, finishType, wmEnable, finishEnable}=getSettings();
    const A5_W=148, A5_H=210;
    const UNIT=0.5; // 縮放用
    const spine=W_SPINE_UNIT=spineWidth*UNIT, W_TOTAL=2*A5_W*UNIT+spine, H_UNIT=A5_H*UNIT;

    while(bookGroup.children.length) bookGroup.remove(bookGroup.children[0]);

    // 背景
    if(!document.getElementById('transparentBg').checked){
        const bgColorValue=document.getElementById('bgColor').value;
        scene.background=new THREE.Color(bgColorValue);
        floor.material.color=scene.background;
    } else { scene.background=null; floor.material.color=new THREE.Color(0x000000); }

    // 三個視角: 攤平、立體封面、簡單透視
    const positions=[[-W_TOTAL-20,0,0],[0,0,0],[W_TOTAL+20,0,20]];
    positions.forEach((pos,i)=>{
        let geom=new THREE.PlaneGeometry(W_TOTAL,H_UNIT);
        let mat;
        if(mainTex){
            mat=new THREE.MeshPhongMaterial({map:mainTex,side:THREE.DoubleSide});
        } else { mat=new THREE.MeshPhongMaterial({color:0x2196F3,side:THREE.DoubleSide}); }
        let mesh=new THREE.Mesh(geom,mat); mesh.castShadow=true; mesh.receiveShadow=true;
        mesh.position.set(pos[0],0,pos[2]);
        mesh.rotation.x=-Math.PI/2*0.9; if(i===2) mesh.rotation.y=-Math.PI/6; // 右側透視
        bookGroup.add(mesh);
    });

    // 浮水印
    if(wmTex && wmEnable){
        if(watermarkMesh) bookGroup.remove(watermarkMesh);
        const wmGeo=new THREE.PlaneGeometry(wmTex.image.width/10,wmTex.image.height/10);
        const wmMat=new THREE.MeshBasicMaterial({map:wmTex,transparent:true,opacity:wmOpacity});
        watermarkMesh=new THREE.Mesh(wmGeo,wmMat);
        watermarkMesh.position.set(0,0,0.1); watermarkMesh.scale.set(wmScale,wmScale,1);
        watermarkMesh.rotation.z=THREE.MathUtils.degToRad(wmRotate);
        bookGroup.add(watermarkMesh);
    } else if(watermarkMesh){ bookGroup.remove(watermarkMesh); watermarkMesh=null; }
}

// Animate
function animate(){ requestAnimationFrame(animate); renderer.render(scene,camera); }
animate();

// Event listeners
document.getElementById('combinedInput').addEventListener('change',e=>{
    const file=e.target.files[0]; if(!file) return;
    new THREE.TextureLoader().load(URL.createObjectURL(file),texture=>{ mainTex=texture; buildBook(); });
});
document.getElementById('renderBtn').addEventListener('click',()=>buildBook());
document.getElementById('downloadBtn').addEventListener('click',()=>{
    renderer.render(scene,camera);
    const bookTitle=document.getElementById('bookTitle').value.trim()||'book-mockup';
    const a=document.createElement('a'); a.href=renderer.domElement.toDataURL('image/png'); a.download=`${bookTitle}.png`; a.click();
});
document.getElementById('spineWidth').addEventListener('input',()=>buildBook());
document.getElementById('bleedMM').addEventListener('input',()=>buildBook());
document.getElementById('bgColor').addEventListener('input',()=>{ if(!document.getElementById('transparentBg').checked){ scene.background=new THREE.Color(document.getElementById('bgColor').value); floor.material.color=scene.background; } });

// 浮水印 UI
document.getElementById('wmOpacity').addEventListener('input',e=>{ wmOpacity=Number(e.target.value); document.getElementById('wmOpacityValue').textContent=wmOpacity.toFixed(2); if(watermarkMesh) watermarkMesh.material.opacity=wmOpacity; });
document.getElementById('wmScale').addEventListener('input',e=>{ wmScale=Number(e.target.value); document.getElementById('wmScaleValue').textContent=wmScale.toFixed(2); if(watermarkMesh) watermarkMesh.scale.set(wmScale,wmScale,1); });
document.getElementById('wmRotate').addEventListener('input',e=>{ wmRotate=Number(e.target.value); document.getElementById('wmRotateValue').textContent=wmRotate+'°'; if(watermarkMesh) watermarkMesh.rotation.z=THREE.MathUtils.degToRad(wmRotate); });
document.getElementById('wmResetBtn').addEventListener('click',()=>{ if(watermarkMesh){ watermarkMesh.position.set(0,0,0.1); wmScale=1; wmRotate=0; watermarkMesh.scale.set(1,1,1); watermarkMesh.rotation.z=0; document.getElementById('wmScale').value=1; document.getElementById('wmRotate').value=0; document.getElementById('wmScaleValue').textContent='1'; document.getElementById('wmRotateValue').textContent='0°'; }});

document.getElementById('watermarkInput').addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; new THREE.TextureLoader().load(URL.createObjectURL(file),texture=>{ wmTex=texture; buildBook(); }); });
document.getElementById('bgImageInput').addEventListener('change',e=>{ const file=e.target.files[0]; if(!file) return; new THREE.TextureLoader().load(URL.createObjectURL(file),texture=>{ bgTex=texture; buildBook(); }); });
</script>
</body>
</html>
